services:
  db:
    image: postgres:16-alpine
    container_name: meetrooms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: meetrooms
      POSTGRES_PASSWORD: meetrooms
      POSTGRES_DB: meetrooms
    ports:
      - '5433:5432'
    volumes:
      - meetrooms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meetrooms']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meetrooms_pgdata:
